<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>MUMOSA Evidence Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:rgba(15,15,20,0.93);color:#ccc;font:13px/1.5 "Segoe UI",sans-serif;height:100vh;display:flex;flex-direction:column}
#status{background:#1a1a22;padding:10px 14px;border-bottom:1px solid #333;font-size:11px;color:#b85c38;letter-spacing:1px}
#status span{color:#666}
#msgs{flex:1;overflow-y:auto;padding:12px}
.msg{margin-bottom:10px;padding:10px 12px;background:#22222e;border-radius:6px;border-left:3px solid #4a7c59}
.msg .lbl{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#b85c38;margin-bottom:3px}
.msg .lbl.you{color:#666}
.msg .txt{white-space:pre-line;font-size:13px}
.msg .obj{font-size:10px;color:#888;margin-top:4px}
#inputbar{background:#1a1a22;padding:10px;border-top:1px solid #333;display:flex;gap:6px}
#input{flex:1;background:#11111a;border:1px solid #333;color:#ccc;padding:8px 10px;border-radius:4px;font:13px/1.4 sans-serif}
#input:focus{outline:none;border-color:#b85c38}
#selected{background:#1a1a22;border-top:1px solid #222;padding:6px 12px;font-size:11px;color:#888}
#selected span{color:#b85c38}
#sendbtn{background:#b85c38;color:#fff;border:none;padding:6px 16px;border-radius:4px;cursor:pointer;font:13px}
#sendbtn:disabled{opacity:.5;cursor:default}
</style>
</head><body>
<div id="status">MUMOSA · <span>click objects in Unreal, ask questions</span></div>
<div id="msgs"></div>
<div id="selected">Selected: <span id="selObj">None</span></div>
<div id="inputbar">
<input id="input" placeholder="Ask about the selected object..." onkeydown="if(event.key==='Enter')send()" autofocus>
<button id="sendbtn" onclick="send()">Ask</button>
</div>
<script>
let asking = false;
async function poll() {
    const r = await (await fetch('/api/status')).json();
    document.getElementById('selObj').textContent = r.selected || 'None';
    const msgs = document.getElementById('msgs');
    msgs.innerHTML = r.chat.map(m => 
        `<div class="msg"><div class="lbl ${m.label==='YOU'?'you':''}">${m.label||'AI'}</div><div class="txt">${m.content}</div></div>`
    ).join('');
    msgs.scrollTop = msgs.scrollHeight;
    setTimeout(poll, 1500);
}
async function send() {
    if (asking) return;
    const inp = document.getElementById('input');
    const q = inp.value.trim();
    if (!q) return;
    inp.value = '';
    asking = true;
    document.getElementById('sendbtn').disabled = true;
    const msgs = document.getElementById('msgs');
    msgs.innerHTML += `<div class="msg"><div class="lbl you">YOU</div><div class="txt">${q}</div></div>`;
        msgs.innerHTML += `<div class="msg" style="border-left-color:#555"><div class="lbl" style="color:#888">MUMOSA</div><div class="txt">Analyzing...</div></div>`;
    msgs.scrollTop = msgs.scrollHeight;
    try {
        const r = await (await fetch('/api/ask', {
            method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({question:q})
        })).json();
        msgs.innerHTML = msgs.innerHTML.replace(
            /<div class="msg" style="border-left-color:#555"><div class="lbl" style="color:#888">Analyzing...<\/div><div class="txt">.*?<\/div><\/div>/,
            `<div class="msg"><div class="lbl">AI</div><div class="txt">${r.response}</div><div class="obj">Object: ${r.object}</div></div>`
        );
    } catch(e) {
        msgs.innerHTML = msgs.innerHTML.replace(/Analyzing.../, 'Error');
    }
    asking = false;
    document.getElementById('sendbtn').disabled = false;
    msgs.scrollTop = msgs.scrollHeight;
}
poll();
</script></body></html>
